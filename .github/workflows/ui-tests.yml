name: UI Tests

on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled

concurrency:
  group: ui-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-ui-tests'
    name: UI test and screenshots
    runs-on: macos-26-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Swift packages and build products
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/DerivedData/Build
            ${{ runner.temp }}/DerivedData/ModuleCache.noindex
            ${{ runner.temp }}/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: >-
            vega-ui-macos-26-intel-xcode-26.6-${{
            hashFiles(
              'Vega.xcodeproj/project.pbxproj',
              'Vega.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved',
              'Packages/WgerAPI/Package.swift',
              'Packages/WgerAPI/Sources/WgerAPI/openapi-generator-config.yaml',
              'Packages/WgerAPI/Sources/WgerAPI/openapi.json'
            )
            }}

      - name: Check toolchain
        run: xcodebuild -version

      - name: Run UI test
        run: make test-ui
        env:
          XCODE_RESULT_BUNDLE_PATH: ${{ runner.temp }}/Vega-UI.xcresult
          XCODEBUILD_FLAGS: >-
            -skipPackagePluginValidation
            -derivedDataPath "${{ runner.temp }}/DerivedData"
            -clonedSourcePackagesDirPath "${{ runner.temp }}/SourcePackages"

      - name: Export screenshot attachments
        if: always()
        run: |
          if [[ -d "${{ runner.temp }}/Vega-UI.xcresult" ]]; then
            xcrun xcresulttool export attachments \
              --path "${{ runner.temp }}/Vega-UI.xcresult" \
              --output-path "${{ runner.temp }}/Vega-UI-attachments"
          fi

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Vega-UI-test-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/Vega-UI.xcresult
            ${{ runner.temp }}/Vega-UI-attachments
          if-no-files-found: warn
          retention-days: 7
